[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiosolv-imaging"
version = "0.1.0"
description = "CardioSolv Stage 0: CT/MR DICOM -> cardiovascular segmentation (NV-Segment-CTMR, TotalSegmentator) -> 3D heart USD"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "numpy<2",
    "scipy",
    "nibabel>=5.2",
    "pydicom>=2.4",
    "scikit-image",
    "usd-core",
]

[project.optional-dependencies]
# NV-Segment-CTMR runtime, as pinned by NVIDIA medical-AI-skills (nv-segment-ctmr)
nvsegment = ["monai>=1.5,<1.6", "torch", "typer", "PyYAML", "fire", "huggingface_hub", "pytorch-ignite", "einops"]
totalsegmentator = ["TotalSegmentator @ git+https://github.com/islamsedibrahim/TotalSegmentator.git"]
server = ["fastapi", "uvicorn[standard]", "python-multipart"]
dicom-extra = ["SimpleITK", "pylibjpeg", "pylibjpeg-libjpeg"]
test = ["pytest"]

[project.scripts]
cardiosolv-segment = "cardiosolv_imaging.cli:main"

[tool.setuptools.packages.find]
include = ["cardiosolv_imaging*"]
